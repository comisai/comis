#
# Grafana datasource provisioning. Auto-loaded by
# docker/observability/docker-compose.yml so `docker compose up` brings Grafana
# online with the Prometheus datasource already wired (no click-ops).
apiVersion: 1
datasources:
  - name: Prometheus
    uid: comis-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      # Match the recording/alert rule evaluation cadence (prometheus.yml).
      timeInterval: 15s
