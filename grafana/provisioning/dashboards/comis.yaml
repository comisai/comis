# SPDX-License-Identifier: Apache-2.0
#
# Grafana dashboard provider. Provisions the 5 Comis
# dashboards-as-code from grafana/dashboards/*.json into a "Comis" folder on
# `docker compose up`. The docker-compose mounts grafana/dashboards/ at
# /etc/grafana/dashboards (the `path` below).
apiVersion: 1
providers:
  - name: Comis
    orgId: 1
    folder: Comis
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: false
