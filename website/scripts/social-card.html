<!doctype html>
<!-- SPDX-License-Identifier: Apache-2.0 -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      * { box-sizing: border-box; }
      html, body { width: 1280px; height: 640px; margin: 0; overflow: hidden; }
      body {
        display: grid;
        padding: 56px;
        background:
          radial-gradient(circle at 84% 18%, rgba(67, 197, 213, 0.14), transparent 30%),
          radial-gradient(circle at 10% 92%, rgba(255, 123, 90, 0.11), transparent 34%),
          #08111e;
        color: #f8fafc;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      main {
        position: relative;
        display: grid;
        grid-template-rows: auto 1fr auto;
        overflow: hidden;
        padding: 46px 52px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 20px;
        background: rgba(14, 25, 41, 0.92);
        box-shadow: 0 32px 90px rgba(0, 0, 0, 0.3);
      }
      main::after {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
        background-size: 48px 48px;
        content: "";
      }
      header, .content, footer { position: relative; z-index: 1; }
      header { display: flex; align-items: center; justify-content: space-between; }
      img { width: 214px; height: auto; }
      .status {
        display: flex;
        align-items: center;
        gap: 10px;
        color: #aebbcf;
        font-family: ui-monospace, SFMono-Regular, monospace;
        font-size: 17px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .status::before {
        width: 10px;
        height: 10px;
        border-radius: 2px;
        background: #ff7b5a;
        box-shadow: 0 0 20px rgba(255, 123, 90, 0.5);
        content: "";
      }
      .content { align-self: center; }
      .kicker {
        margin: 0 0 18px;
        color: #ff7b5a;
        font-family: ui-monospace, SFMono-Regular, monospace;
        font-size: 20px;
        font-weight: 600;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }
      h1 {
        max-width: 1040px;
        margin: 0;
        font-size: 60px;
        font-weight: 600;
        letter-spacing: -0.04em;
        line-height: 1.04;
      }
      footer {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        border-top: 1px solid rgba(255, 255, 255, 0.12);
      }
      footer span {
        padding-top: 22px;
        color: #d8e1ec;
        font-family: ui-monospace, SFMono-Regular, monospace;
        font-size: 17px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      footer span + span { padding-left: 28px; border-left: 1px solid rgba(255, 255, 255, 0.12); }
      footer span::before {
        display: inline-block;
        width: 9px;
        height: 9px;
        margin-right: 12px;
        border-radius: 2px;
        background: #43c5d5;
        content: "";
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <img src="../public/images/comis-logo.png" alt="Comis" />
        <div class="status">Open source / Self-hosted</div>
      </header>
      <div class="content">
        <p class="kicker">Security-first agent runtime</p>
        <h1>Let agents learn and act. Keep authority in the runtime.</h1>
      </div>
      <footer aria-label="Comis advantages">
        <span>Governed learning</span>
        <span>Bounded action</span>
        <span>Recorded evidence</span>
      </footer>
    </main>
  </body>
</html>
