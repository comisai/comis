<!doctype html>
<!-- SPDX-License-Identifier: Apache-2.0 -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      * { box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; }
      body {
        display: grid;
        padding: 64px;
        background:
          radial-gradient(circle at 82% 22%, rgba(31, 191, 212, 0.11), transparent 32%),
          radial-gradient(circle at 12% 88%, rgba(255, 106, 69, 0.09), transparent 35%),
          #0f172a;
        color: #f9fafb;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      main {
        display: grid;
        grid-template-rows: auto 1fr auto;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 20px;
        padding: 48px;
        background: rgba(30, 41, 59, 0.68);
      }
      header { display: flex; align-items: center; justify-content: space-between; }
      img { width: 230px; height: auto; }
      .status {
        display: flex;
        align-items: center;
        gap: 12px;
        color: #cbd5e1;
        font-family: ui-monospace, SFMono-Regular, monospace;
        font-size: 20px;
        font-weight: 600;
      }
      .status::before {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #ff6a45;
        content: "";
      }
      h1 {
        align-self: center;
        max-width: 900px;
        margin: 0;
        font-size: 62px;
        font-weight: 600;
        letter-spacing: -0.035em;
        line-height: 1.08;
      }
      h1::after {
        display: block;
        width: 112px;
        height: 6px;
        margin-top: 32px;
        border-radius: 3px;
        background: #ff6a45;
        content: "";
      }
      .flow { display: grid; grid-template-columns: auto 1fr auto 1fr auto 1fr auto 1fr auto; align-items: center; gap: 14px; }
      .node {
        color: #f9fafb;
        font-family: ui-monospace, SFMono-Regular, monospace;
        font-size: 18px;
        font-weight: 600;
      }
      .line { height: 2px; background: #1fbfd4; opacity: 0.72; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <img src="../public/images/comis-logo.png" alt="Comis" />
        <div class="status">Open-source governed agent runtime</div>
      </header>
      <h1>Govern the execution, memory, security, authority, and cost of every agent.</h1>
      <div class="flow" aria-hidden="true">
        <span class="node">Receive</span><span class="line"></span>
        <span class="node">Route</span><span class="line"></span>
        <span class="node">Coordinate</span><span class="line"></span>
        <span class="node">Constrain</span><span class="line"></span>
        <span class="node">Explain</span>
      </div>
    </main>
  </body>
</html>
