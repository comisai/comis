# Comis Test Configuration -- Storage-Modes Integration Suite, file storage
#
# Dedicated config for test/integration/credential-storage-modes.test.ts
# (file-mode describe block).
#
# Uses security.storage: file (unified key, NOT the removed oauth.storage).
# No SECRETS_MASTER_KEY required — file mode uses plaintext JSON files.
#
# Uses port 8801 to avoid conflicts with other test suites:
#   8800 = config.test-storage-modes-encrypted (pair config)

tenantId: "storage-modes-file-test"
logLevel: "debug"
dataDir: "" # Resolves to ~/.comis at runtime

agents:
  default:
    name: "StorageModesFileTestAgent"
    model: default
    thinkingLevel: "off"
    provider: default
    maxSteps: 10
    budgets:
      perExecution: 500000
      perHour: 5000000
      perDay: 50000000
    circuitBreaker:
      failureThreshold: 100
      resetTimeoutMs: 1000
      halfOpenTimeoutMs: 500
    rag:
      enabled: false
    scheduler:
      cron:
        enabled: true
        defaultTimezone: "UTC"

gateway:
  enabled: true
  host: "127.0.0.1"
  port: 8801
  tokens:
    - id: "admin-token"
      secret: "admin-secret-key-for-storage-modes-file-test"
      scopes: ["rpc", "ws", "admin"]
  rateLimit:
    windowMs: 60000
    maxRequests: 10000
  maxBatchSize: 50
  wsHeartbeatMs: 30000

scheduler:
  cron:
    enabled: true
    defaultTimezone: "UTC"
  heartbeat:
    intervalMs: 300000
    showOk: false
    showAlerts: true
  quietHours:
    enabled: false
    criticalBypass: true

memory:
  dbPath: "test-memory-storage-modes-file.db"

security:
  storage: file
  agentToAgent:
    enabled: true

monitoring:
  disk:
    enabled: false
  resources:
    enabled: false
  systemd:
    enabled: false
  securityUpdates:
    enabled: false
  git:
    enabled: false

models:
  defaultProvider: anthropic
