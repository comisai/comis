# PI Defense Memory + Rate Limiter E2E Tests
#
# Uses port 8611 to avoid conflicts. Echo provider for deterministic responses.
# Tests: MemoryWriteValidator, InjectionRateLimiter in running daemon.

tenantId: "test"
logLevel: "debug"
dataDir: ""

agents:
  test-agent:
    name: "PIDefenseMemRateAgent"
    model: default
    thinkingLevel: "off"
    provider: default
    maxSteps: 5
    budgets:
      perExecution: 500000
      perHour: 5000000
      perDay: 50000000
    circuitBreaker:
      failureThreshold: 100
      resetTimeoutMs: 1000
      halfOpenTimeoutMs: 500
    rag:
      enabled: false

memory:
  dbPath: "test-memory-pi-defense-memrate.db"
  walMode: true

gateway:
  enabled: true
  host: "127.0.0.1"
  port: 8611
  tokens:
    - id: test-token
      secret: pi-defense-memrate-test-secret-token-xyz789
      scopes: ["rpc", "ws", "admin", "sse"]
    # The injection rate limiter keys each throttle bucket by the AUTHENTICATED
    # principal (gateway binds identity to the token's client id, never a
    # caller-asserted sessionKey.userId — an attacker must not evade the
    # throttle by rotating a claimed user id). Each principal is one token, so
    # the rate-limiter tests below use a dedicated token per bucket to stay
    # hermetic (a fresh, unpolluted counter) and to exercise cross-principal
    # isolation end-to-end.
    - id: test-token-rl-warn
      secret: pi-defense-memrate-ratelimit-warn-secret-token-01
      scopes: ["rpc", "ws", "admin", "sse"]
    - id: test-token-rl-audit
      secret: pi-defense-memrate-ratelimit-audit-secret-token-02
      scopes: ["rpc", "ws", "admin", "sse"]
    - id: test-token-rl-user-a
      secret: pi-defense-memrate-ratelimit-user-a-secret-token-03
      scopes: ["rpc", "ws", "admin", "sse"]
    - id: test-token-rl-user-b
      secret: pi-defense-memrate-ratelimit-user-b-secret-token-04
      scopes: ["rpc", "ws", "admin", "sse"]
  rateLimit:
    windowMs: 60000
    maxRequests: 10000

monitoring:
  disk:
    enabled: false
  resources:
    enabled: false
  systemd:
    enabled: false
  securityUpdates:
    enabled: false
  git:
    enabled: false

models:
  defaultProvider: anthropic
