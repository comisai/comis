# Comis Test Configuration -- Auth-State Matrix, file storage
#
# Dedicated config for test/integration/auth-state-matrix.test.ts (file rows).
# Configures `security.storage: file` so the CLI's auth list/logout/status
# subcommands take the CLI-local path (no daemon RPC needed). The matrix
# test still boots the daemon for the (file, up) rows -- the daemon
# presence is irrelevant for file storage but the matrix coverage requires
# all 4 cells.
#
# Uses port 8562 to avoid conflicts with other test suites.

tenantId: "auth-file-test"
logLevel: "debug"
dataDir: "" # Resolves to ~/.comis at runtime

agents:
  default:
    name: "AuthFileTestAgent"
    model: default
    thinkingLevel: "off"
    provider: default
    maxSteps: 10
    budgets:
      perExecution: 500000
      perHour: 5000000
      perDay: 50000000
    circuitBreaker:
      failureThreshold: 100
      resetTimeoutMs: 1000
      halfOpenTimeoutMs: 500
    rag:
      enabled: false
    scheduler:
      cron:
        enabled: true
        defaultTimezone: "UTC"

gateway:
  enabled: true
  host: "127.0.0.1"
  port: 8562
  tokens:
    - id: "admin-token"
      secret: "admin-secret-key-for-auth-file-test"
      scopes: ["rpc", "ws", "admin"]
  rateLimit:
    windowMs: 60000
    maxRequests: 10000
  maxBatchSize: 50
  wsHeartbeatMs: 30000

scheduler:
  cron:
    enabled: true
    defaultTimezone: "UTC"
  heartbeat:
    intervalMs: 300000
    showOk: false
    showAlerts: true
  quietHours:
    enabled: false
    criticalBypass: true

memory:
  dbPath: "test-memory-auth-file.db"

security:
  storage: file
  agentToAgent:
    enabled: true

monitoring:
  disk:
    enabled: false
  resources:
    enabled: false
  systemd:
    enabled: false
  securityUpdates:
    enabled: false
  git:
    enabled: false

models:
  defaultProvider: anthropic
