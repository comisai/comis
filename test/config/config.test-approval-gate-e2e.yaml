tenantId: test
logLevel: debug
dataDir: /tmp/comis-test-approval-gate-e2e
agents:
  default:
    name: TestAgent
    model: claude-opus-4-6
    thinkingLevel: off
    provider: anthropic
    maxSteps: 10
    budgets:
      perExecution: 500000
      perHour: 5000000
      perDay: 50000000
    circuitBreaker:
      failureThreshold: 100
      resetTimeoutMs: 1000
      halfOpenTimeoutMs: 500
    rag:
      enabled: false
    scheduler:
      cron:
        enabled: false
  helper:
    name: HelperAgent
    model: claude-opus-4-6
    thinkingLevel: off
    provider: anthropic
    maxSteps: 5
    budgets:
      perExecution: 500000
      perHour: 5000000
      perDay: 50000000
    circuitBreaker:
      failureThreshold: 100
      resetTimeoutMs: 1000
      halfOpenTimeoutMs: 500
    rag:
      enabled: false
gateway:
  enabled: true
  host: 127.0.0.1
  port: 8522
  tokens:
    - id: test-token
      secret: test-secret-key-for-approval-gate-e2e
      scopes:
        - rpc
        - ws
        - admin
  rateLimit:
    windowMs: 60000
    maxRequests: 10000
  maxBatchSize: 50
  wsHeartbeatMs: 30000
approvals:
  enabled: true
  defaultTimeoutMs: 3000
scheduler:
  cron:
    enabled: false
  heartbeat:
    intervalMs: 300000
    showOk: false
    showAlerts: true
  quietHours:
    enabled: false
    criticalBypass: true
# This suite exercises ONLY the approval-gate lifecycle (RPC/SSE/WS/tool-wrapper) — it never
# uses memory recall or RAG (both agents set rag.enabled:false). Disable embedding generation so
# the daemon does NOT load the ~53s local embedding GGUF at boot: under the full integration
# suite's parallel forks that load pushed this test's 120s beforeAll daemon-boot budget over the
# edge (it passes in isolation). FTS5-only memory is sufficient here. Mirrors config.test-daemon-lifecycle.yaml.
embedding:
  enabled: false
memory:
  dbPath: test-memory-approval-gate-e2e.db
security:
  agentToAgent:
    enabled: false
monitoring:
  disk:
    enabled: false
  resources:
    enabled: false
  systemd:
    enabled: false
  securityUpdates:
    enabled: false
  git:
    enabled: false
models:
  defaultProvider: anthropic
