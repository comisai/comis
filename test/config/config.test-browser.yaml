# Comis Test Configuration — Browser Integration Tests
#
# Designed for browser integration testing with:
# - Port 8452 to avoid conflicts with other test suites (4766-8451)
# - browser: true to trigger BrowserService creation
# - Separate memory DB to avoid cross-test pollution
# - All other settings identical to config.test-infra.yaml

tenantId: "test"
logLevel: "debug"
dataDir: "" # Resolves to ~/.comis at runtime

agents:
  default:
    name: "TestAgent"
    model: default
    thinkingLevel: "off"
    provider: default
    skills:
      builtinTools:
        browser: true
    maxSteps: 10
    budgets:
      perExecution: 500000
      perHour: 5000000
      perDay: 50000000
    circuitBreaker:
      failureThreshold: 100
      resetTimeoutMs: 1000
      halfOpenTimeoutMs: 500
    rag:
      enabled: false
    scheduler:
      cron:
        enabled: true
        defaultTimezone: "UTC"

# The suite serves its fixture pages from a local HTTP server; loopback
# navigation is SSRF-blocked by default and needs this explicit opt-in.
browser:
  allowLoopbackNavigation: true

gateway:
  enabled: true
  host: "127.0.0.1"
  port: 8452
  tokens:
    - id: "test-token"
      secret: "test-secret-key-for-integration-tests"
      scopes: ["rpc", "ws", "admin"]
  rateLimit:
    windowMs: 60000
    maxRequests: 10000
  maxBatchSize: 50
  wsHeartbeatMs: 30000

scheduler:
  cron:
    enabled: true
    defaultTimezone: "UTC"
  heartbeat:
    intervalMs: 300000
    showOk: false
    showAlerts: true
  quietHours:
    enabled: false
    criticalBypass: true

memory:
  dbPath: "test-browser-memory.db"

security:
  agentToAgent:
    enabled: true

monitoring:
  disk:
    enabled: false
  resources:
    enabled: false
  systemd:
    enabled: false
  securityUpdates:
    enabled: false
  git:
    enabled: false

models:
  defaultProvider: anthropic
