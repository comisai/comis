# Comis Test Configuration — activity composition acceptance test.
#
# Dedicated config for packages/daemon/src/__tests__/setup-activity.composition.test.ts
# (Part B — daemon-level boot proof). A UNIQUE gateway port (47668)
# + a dedicated memory db keep this boot isolated from the 4766 default-config
# port and other parallel test suites. The activity pipe assertions are proven
# in-memory (Part A); this boot only confirms the daemon constructs + drains the
# ActivityStream without a long-running timer leak.

tenantId: "test"
logLevel: "debug"
dataDir: "" # Resolves to ~/.comis at runtime

agents:
  default:
    name: "TestAgent"
    model: default
    provider: default
    maxSteps: 10
    budgets:
      perExecution: 500000
      perHour: 5000000
      perDay: 50000000
    circuitBreaker:
      failureThreshold: 100
      resetTimeoutMs: 1000
      halfOpenTimeoutMs: 500
    rag:
      enabled: false
    # Fail-closed enable map: the activation test drives an
    # Echo turn for agent `default`, channelType `echo`, channelId `echo-activation`,
    # so the pipeline (execution-pipeline.ts:407) mints the 3-segment rendererKey
    # `default:echo:echo-activation`. Enabling it + emergencyDisabled:false ensures
    # the kill-switch gate (activity-turn-coordinator.ts:277-279) does NOT suppress
    # the render — otherwise a passing assertion would be a false negative.
    activity:
      verbosity: "normal"
      emergencyDisabled: false
      channels:
        "default:echo:echo-activation":
          enabled: true
    scheduler:
      cron:
        enabled: true
        maxConcurrentRuns: 5
        defaultTimezone: "UTC"

gateway:
  enabled: true
  host: "127.0.0.1"
  port: 47668
  tokens:
    - id: "test-token"
      secret: "test-secret-key-for-activity-composition"
      scopes: ["rpc", "ws", "admin"]
  rateLimit:
    windowMs: 60000
    maxRequests: 10000
  maxBatchSize: 50
  wsHeartbeatMs: 30000

scheduler:
  cron:
    enabled: true
    maxConcurrentRuns: 5
    defaultTimezone: "UTC"
  heartbeat:
    intervalMs: 300000
    showOk: false
    showAlerts: true
  quietHours:
    enabled: false
    criticalBypass: true

memory:
  dbPath: "test-memory-activity-composition.db"

security:
  agentToAgent:
    enabled: true

monitoring:
  disk:
    enabled: false
  resources:
    enabled: false
  systemd:
    enabled: false
  securityUpdates:
    enabled: false
  git:
    enabled: false

models:
  defaultProvider: anthropic
