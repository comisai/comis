# Comis Test Configuration — Log Orchestration Tests
#
# Identical to config.test-logs.yaml but with:
# - Unique port (8480) to avoid conflicts with 4766-8472
# - Unique dbPath to avoid cross-test data leaks
# - Debug logging for log orchestration verification

tenantId: "test"
logLevel: "debug"
dataDir: "" # Resolves to ~/.comis at runtime

agents:
  default:
    name: "TestAgent"
    model: default
    thinkingLevel: "off"
    provider: default
    maxSteps: 10
    budgets:
      perExecution: 500000
      perHour: 5000000
      perDay: 50000000
    circuitBreaker:
      failureThreshold: 100
      resetTimeoutMs: 1000
      halfOpenTimeoutMs: 500
    rag:
      enabled: false
    scheduler:
      cron:
        enabled: true
        defaultTimezone: "UTC"

gateway:
  enabled: true
  host: "127.0.0.1"
  port: 8480
  tokens:
    - id: "test-token"
      secret: "test-secret-key-for-integration-tests"
      scopes: ["rpc", "ws", "admin"]
  rateLimit:
    windowMs: 60000
    maxRequests: 10000
  maxBatchSize: 50
  wsHeartbeatMs: 30000

scheduler:
  cron:
    enabled: true
    defaultTimezone: "UTC"
  heartbeat:
    intervalMs: 300000
    showOk: false
    showAlerts: true
  quietHours:
    enabled: false
    criticalBypass: true

# Embedding OFF: the local provider downloads a GGUF manifest from
# HuggingFace at daemon startup; when HF throttles CI runner IPs the
# resulting "No embedding provider available" warn fails this suite's
# clean-startup-logs assertions. These tests assert log hygiene, not
# embedding behavior -- keep them network-independent (rag is already off).
embedding:
  enabled: false

memory:
  dbPath: "test-log-orchestration-memory.db"

security:
  agentToAgent:
    enabled: true

monitoring:
  disk:
    enabled: false
  resources:
    enabled: false
  systemd:
    enabled: false
  securityUpdates:
    enabled: false
  git:
    enabled: false

models:
  defaultProvider: anthropic
