# Comis Test Configuration -- Behavioral Residency Test
#
# Dedicated config for test/integration/secret-rpc-residency.test.ts.
# Boots a daemon with disableRedaction:true (passed via TestDaemonOptions,
# NOT in this YAML) so the residency canary assertion can observe raw
# Pino payloads. Production daemon NEVER runs with disableRedaction; the
# packages/*/src architecture invariant enforces this.
#
# Uses port 8561 to avoid conflicts with other test suites.
# secrets-lifecycle uses 8560; this test sits adjacent.
#
# SECRETS_MASTER_KEY is supplied at runtime by the test (NOT this file).

tenantId: "secret-residency-test"
logLevel: "debug"
dataDir: "" # Resolves to ~/.comis at runtime

agents:
  default:
    name: "ResidencyTestAgent"
    model: default
    thinkingLevel: "off"
    provider: default
    maxSteps: 10
    budgets:
      perExecution: 500000
      perHour: 5000000
      perDay: 50000000
    circuitBreaker:
      failureThreshold: 100
      resetTimeoutMs: 1000
      halfOpenTimeoutMs: 500
    rag:
      enabled: false
    scheduler:
      cron:
        enabled: true
        defaultTimezone: "UTC"

gateway:
  enabled: true
  host: "127.0.0.1"
  port: 8561
  tokens:
    - id: "admin-token"
      secret: "admin-secret-key-for-secret-residency-test"
      scopes: ["rpc", "ws", "admin"]
    - id: "rpc-only-token"
      # Used by the unauthorized-mode test to verify that
      # secrets.* admin-scoped methods reject non-admin tokens at the gateway
      # WITHOUT leaking plaintext in the error.
      secret: "rpc-only-secret-key-for-secret-residency-test"
      scopes: ["rpc", "ws"]
  rateLimit:
    windowMs: 60000
    maxRequests: 10000
  maxBatchSize: 50
  wsHeartbeatMs: 30000
  # Override per-connection WS message rate limit. Default is 60/60s which
  # would cap the 100-sequential-read stress test below the iteration count.
  # Set to 10000/60s so the residency test can exercise the full 100 reads
  # without tripping the gateway's connection-level guard (this is a test-
  # only config; production daemons retain the 60/60s default).
  wsMessageRateLimit:
    maxMessages: 10000
    windowMs: 60000

scheduler:
  cron:
    enabled: true
    defaultTimezone: "UTC"
  heartbeat:
    intervalMs: 300000
    showOk: false
    showAlerts: true
  quietHours:
    enabled: false
    criticalBypass: true

memory:
  dbPath: "test-memory-secret-residency.db"

security:
  agentToAgent:
    enabled: true

monitoring:
  disk:
    enabled: false
  resources:
    enabled: false
  systemd:
    enabled: false
  securityUpdates:
    enabled: false
  git:
    enabled: false

models:
  defaultProvider: anthropic
