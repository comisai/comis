name: Docker Hub Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Secrets required (Settings → Secrets → Actions):
#   DOCKERHUB_USERNAME — Docker Hub username (comisai)
#   DOCKERHUB_TOKEN   — Docker Hub access token (Read/Write/Delete)

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.19.0

      - name: Verify release tag matches package version
        run: node .github/scripts/verify-release-tag.mjs "${GITHUB_REF_NAME}"

  # ---------------------------------------------------------------------------
  # Build per-platform digests for the daemon image.
  # Each platform runs natively on its own runner (no QEMU emulation) — the
  # arm64 build under QEMU intermittently hangs on Node-native deps and tsc,
  # so it now uses GitHub's native arm runner.
  # Both variants (default + slim) are built per runner so the shared build
  # stage layers are cached and the second variant is near-instant.
  # ---------------------------------------------------------------------------
  build:
    needs: preflight
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # --- default variant ---
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        id: build-default
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: COMIS_VARIANT=default
          cache-from: type=gha,scope=dh-default-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=dh-default-${{ matrix.platform }}
          outputs: type=image,name=comisai/comis,push-by-digest=true,name-canonical=true,push=true

      # --- slim variant (reuses cached build stage layers from default) ---
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        id: build-slim
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: COMIS_VARIANT=slim
          cache-from: |
            type=gha,scope=dh-slim-${{ matrix.platform }}
            type=gha,scope=dh-default-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=dh-slim-${{ matrix.platform }}
          outputs: type=image,name=comisai/comis,push-by-digest=true,name-canonical=true,push=true

      - name: Export digests
        run: |
          mkdir -p /tmp/digests/default /tmp/digests/slim
          touch "/tmp/digests/default/${DEFAULT_DIGEST#sha256:}"
          touch "/tmp/digests/slim/${SLIM_DIGEST#sha256:}"
        env:
          DEFAULT_DIGEST: ${{ steps.build-default.outputs.digest }}
          SLIM_DIGEST: ${{ steps.build-slim.outputs.digest }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: digests-default-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: /tmp/digests/default/*
          if-no-files-found: error
          retention-days: 1

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: digests-slim-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: /tmp/digests/slim/*
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Merge per-platform digests into a multi-arch manifest — default variant
  # Tags: X.Y.Z · X.Y · latest
  # ---------------------------------------------------------------------------
  merge-default:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: digests-default-*
          path: /tmp/digests/default
          merge-multiple: true

      - uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: meta
        with:
          images: comisai/comis
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Create and push multi-arch manifest
        working-directory: /tmp/digests/default
        run: |
          mapfile -t tags < <(jq -r '.tags[]' <<< '${{ steps.meta.outputs.json }}')
          mapfile -t digests < <(printf 'comisai/comis@sha256:%s\n' *)
          tag_args=()
          for tag in "${tags[@]}"; do
            tag_args+=("-t" "${tag}")
          done
          docker buildx imagetools create "${tag_args[@]}" "${digests[@]}"

  # ---------------------------------------------------------------------------
  # Merge per-platform digests into a multi-arch manifest — slim variant
  # Tags: X.Y.Z-slim · X.Y-slim · latest-slim
  # ---------------------------------------------------------------------------
  merge-slim:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: digests-slim-*
          path: /tmp/digests/slim
          merge-multiple: true

      - uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: meta
        with:
          images: comisai/comis
          flavor: |
            suffix=-slim,onlatest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Create and push multi-arch manifest
        working-directory: /tmp/digests/slim
        run: |
          mapfile -t tags < <(jq -r '.tags[]' <<< '${{ steps.meta.outputs.json }}')
          mapfile -t digests < <(printf 'comisai/comis@sha256:%s\n' *)
          tag_args=()
          for tag in "${tags[@]}"; do
            tag_args+=("-t" "${tag}")
          done
          docker buildx imagetools create "${tag_args[@]}" "${digests[@]}"

  # ---------------------------------------------------------------------------
  # Build and push web dashboard image (multi-arch, single buildx step)
  # Tags: X.Y.Z · X.Y · latest
  # ---------------------------------------------------------------------------
  build-web:
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: web-meta
        with:
          images: comisai/comis-web
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile.web
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.web-meta.outputs.tags }}
          labels: ${{ steps.web-meta.outputs.labels }}
          cache-from: type=gha,scope=dh-web
          cache-to: type=gha,mode=max,scope=dh-web

  # Publish the community-facing GitHub release only after every Docker image
  # is available and the independent npm workflow for the same commit succeeds.
  github-release:
    needs: [merge-default, merge-slim, build-web]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Wait for successful npm publish and GHCR workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Budget stated once. It has to exceed the whole npm-publish run, not
          # just its publish step: for v1.0.56 the old 120x15s (30 min) expired
          # 2m38s before npm-publish finished and failed the release, while
          # v1.0.55 cleared the identical wait with 18 seconds to spare. The
          # window also floats — this job starts only after the image builds, so
          # faster builds make it expire EARLIER. Keep the margin wide.
          ATTEMPTS=240
          INTERVAL_SECONDS=15
          wait_for_workflow() {
            local workflow="$1"
            local label="$2"
            for attempt in $(seq 1 "${ATTEMPTS}"); do
              response="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?head_sha=${GITHUB_SHA}&event=push&per_page=10")"
              run="$(jq -c --arg ref "${GITHUB_REF_NAME}" \
                '[.workflow_runs[] | select(.head_branch == $ref)] | first // {}' \
                <<<"${response}")"
              status="$(jq -r '.status // "missing"' <<<"${run}")"
              conclusion="$(jq -r '.conclusion // "pending"' <<<"${run}")"
              url="$(jq -r '.html_url // ""' <<<"${run}")"
              if [[ "${status}" == "completed" ]]; then
                if [[ "${conclusion}" == "success" ]]; then
                  echo "${label} succeeded: ${url}"
                  return 0
                fi
                echo "${label} finished with ${conclusion}: ${url}" >&2
                return 1
              fi
              echo "Waiting for ${label} (${status}, attempt ${attempt}/${ATTEMPTS})"
              sleep "${INTERVAL_SECONDS}"
            done
            echo "Timed out after $((ATTEMPTS * INTERVAL_SECONDS / 60)) minutes waiting for ${workflow} for ${GITHUB_REF_NAME} at ${GITHUB_SHA}" >&2
            echo "The run may still be in progress — compare its duration against this budget before assuming a real failure." >&2
            return 1
          }
          wait_for_workflow npm-publish.yml "npm publish workflow"
          wait_for_workflow docker-release.yml "GHCR workflow"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          generate_release_notes: true
