name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install system dependencies (ffmpeg, bubblewrap)
        # ffmpeg/ffprobe drive the media-conversion skill; bubblewrap is the
        # OS-level exec sandbox. The daemon emits a startup warn for each
        # missing tool, which the log-validator (used by v13-prompt-structural,
        # daemon-lifecycle, and log-orchestration integration tests) flags as
        # an "unexpected warning". Installing them keeps the runner aligned
        # with the production Linux target.
        run: sudo apt-get update && sudo apt-get install -y ffmpeg bubblewrap

      - name: Allow unprivileged user namespaces (bubblewrap sandbox tests)
        # Runner image 20260525.161+ enforces Ubuntu 24.04's
        # kernel.apparmor_restrict_unprivileged_userns=1, which strips
        # CAP_NET_ADMIN from bwrap's user namespace. Every --unshare-net
        # invocation then dies with "bwrap: loopback: Failed RTM_NEWADDR:
        # Operation not permitted", failing the credential-broker /
        # terminal-driver sandbox suites (green on image 20260518.149).
        # Relaxing the sysctl restores the pre-20260525 runner behavior so
        # the sandbox tests actually run instead of being skipped.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Configure git identity for daemon config-versioning tests
        # config-apply-e2e and config-git-lifecycle-e2e drive the daemon's
        # built-in git versioning of config.yaml; the daemon shells out to
        # `git commit` which fails on the bare CI runner with no global
        # user.email/user.name configured, leaving config.history empty.
        run: |
          git config --global user.email "ci@comis.local"
          git config --global user.name "Comis CI"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Docs (MDX syntax check)
        # Compiles docs/**/*.mdx so a bare `<`/`{` in prose fails here instead
        # of server-side at the Mintlify deploy. Runs before the build because
        # it needs no compiled output — only the installed MDX compiler.
        run: pnpm docs:check

      - name: Build
        run: pnpm build

      - name: Architecture (dist-mode madge cycle check)
        id: arch-madge-dist
        run: npx madge --circular --extensions ts packages/*/dist

      - name: Architecture (project-reference cycle check)
        id: arch-tsc-b-dry
        # Walks the full project-references graph from the umbrella package,
        # which transitively references all 13 @comis/* packages — surfaces
        # TS6202 (project-reference cycle) without requiring a root tsconfig.json.
        run: pnpm tsc -b --dry packages/comis

      - name: Architecture tests (explicit visibility)
        run: pnpm test:architecture

      - name: Lint (security)
        run: pnpm lint:security

      # Composite green check that aggregates all required test/lint jobs.
      # Each of the four commands runs as a separate CI step so logs are
      # readable; any non-zero exit fails the PR.

      - name: Unit tests with coverage
        run: pnpm test --coverage

      - name: Integration tests with coverage
        run: pnpm test:integration --coverage

      - name: E2E orchestrate
        run: pnpm test:orchestrate

      - name: E2E flow-matrix gate
        run: pnpm test:orchestrate --check-matrix

      - name: Test (deterministic integration CI gates)
        run: |
          npx vitest run \
            --config test/vitest.config.ts \
            test/integration/install-detour-soft-stop-e2e.test.ts \
            test/integration/install-detour-advise-e2e.test.ts \
            test/integration/tooling-fixture-render.test.ts

      - name: Tarball smoke
        run: pnpm smoke:tarball

      - name: Audit dependencies
        run: pnpm audit --prod
