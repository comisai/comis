name: Publish to npm

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish (for example, v1.0.53)
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    # Bounded so a wedged step fails in tens of minutes instead of burning the
    # 6-hour GitHub default. One earlier release run sat for 2h26m before it
    # gave up, and nothing downstream can tell "slow" from "hung" until then.
    timeout-minutes: 90

    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    permissions:
      contents: read
      id-token: write
      # Reading ci.yml's run for this commit — see "Require a green CI run".
      actions: read

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.19.0
          cache: pnpm
          registry-url: https://registry.npmjs.org/

      - name: Verify release tag matches package version
        run: node .github/scripts/verify-release-tag.mjs "${RELEASE_TAG}"

      - name: Install system dependencies (ffmpeg, bubblewrap)
        # The release validation below includes the Linux-gated terminal-driver
        # tests (*.linux.test.ts) that
        # shell out to `which bwrap` and FAIL — not skip — when bubblewrap is
        # absent (resolveBwrapPath throws). The CI test jobs install the same
        # dependencies so the release gate exercises the same host capabilities.
        # ffmpeg/ffprobe likewise drive the media-conversion skill tests.
        run: sudo apt-get update && sudo apt-get install -y ffmpeg bubblewrap

      - name: Allow unprivileged user namespaces (bubblewrap sandbox tests)
        # Ubuntu 24.04 runner images enforce
        # kernel.apparmor_restrict_unprivileged_userns=1, which breaks any
        # bwrap --unshare-net test ("loopback: Failed RTM_NEWADDR").
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # The integration/e2e daemons boot a LOCAL embedding model; global test
      # setup downloads the ~139 MB GGUF once from Hugging Face and per-fork
      # boots hard-link it. When HF is slow or throttled that download blows
      # the cap and 40+ daemon boots cold-download in parallel straight into
      # the 60s hook timeout. Persist the model across runs so HF is never
      # on the boot path. Key must track DEFAULT_EMBEDDING_MODEL_URI
      # (test/support/model-cache.ts).
      - name: Cache local embedding models
        id: model-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.comis/models
          key: embedding-models-nomic-embed-text-v1.5-Q8_0

      - name: Configure git identity for daemon config-versioning tests
        # The validation below includes the config git-lifecycle suites, whose
        # daemons commit config changes — a runner without user.email/user.name
        # fails those commits (0 history entries). Same step as the ci.yml jobs.
        run: |
          git config --global user.email "ci@comis.local"
          git config --global user.name "Comis CI"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `pnpm validate:full` used to run here. It re-ran the ENTIRE gate suite
      # serially in this one job — the same suite ci.yml had already run for
      # this exact commit, sharded and in parallel, when it landed on main.
      # For v1.0.56 that step took 48m57s of a 51-minute publish and proved
      # nothing new. Worse, it made the release racy: dockerhub-release.yml
      # waits for this workflow on a fixed budget, and a ~50-minute publish
      # blew through it (v1.0.55 cleared the same wait with 18 seconds spare).
      #
      # Gate on CI's own aggregate result instead, then do only the work that
      # is specific to publishing: build the artifact and verify its shape.
      - name: Require a green CI run for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Tags do not trigger ci.yml (it runs on pushes to main and on PRs),
          # so the run to look for is the one for this same commit on main.
          ATTEMPTS=180
          INTERVAL_SECONDS=15
          sha="$(git rev-parse HEAD)"
          for attempt in $(seq 1 "${ATTEMPTS}"); do
            run="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${sha}&per_page=10" \
              | jq -c '[.workflow_runs[]] | first // {}')"
            status="$(jq -r '.status // "missing"' <<<"${run}")"
            conclusion="$(jq -r '.conclusion // "pending"' <<<"${run}")"
            url="$(jq -r '.html_url // ""' <<<"${run}")"
            if [[ "${status}" == "completed" ]]; then
              if [[ "${conclusion}" == "success" ]]; then
                echo "CI succeeded for ${sha}: ${url}"
                exit 0
              fi
              echo "CI finished with '${conclusion}' for ${sha}: ${url}" >&2
              echo "Refusing to publish a commit whose CI did not pass." >&2
              exit 1
            fi
            echo "Waiting for CI on ${sha} (${status}, attempt ${attempt}/${ATTEMPTS})"
            sleep "${INTERVAL_SECONDS}"
          done
          echo "Timed out after $((ATTEMPTS * INTERVAL_SECONDS / 60)) minutes waiting for ci.yml on ${sha}." >&2
          echo "Check whether CI ever ran for this commit before retrying the publish." >&2
          exit 1

      # `pnpm publish` runs prepack, which needs a built dist and fails without
      # one. Clean rather than incremental: a release must not inherit stale
      # output. smoke:tarball then packs and inspects the real artifact, which
      # is the check that catches bundling regressions in what users install.
      - name: Build release artifacts
        run: pnpm build:clean

      - name: Verify the packed tarball
        run: pnpm smoke:tarball

      - name: Publish packages
        run: pnpm publish -r --access public --no-git-checks --provenance --config.node-linker=hoisted
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}


      - name: Check embedding model completeness (guards the cache save)
        id: model-cache-complete
        if: always() && steps.model-cache.outputs.cache-hit != 'true'
        run: |
          rm -f ~/.comis/models/*.ipull* 2>/dev/null || true
          if ls ~/.comis/models/*nomic-embed*.gguf >/dev/null 2>&1; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
          else
            echo "complete=false" >> "$GITHUB_OUTPUT"
          fi

      # Save even when the job failed — a slow-registry run that still finished
      # the download banks the model for every later run.
      - name: Save local embedding models cache
        if: always() && steps.model-cache-complete.outputs.complete == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.comis/models
          key: embedding-models-nomic-embed-text-v1.5-Q8_0
