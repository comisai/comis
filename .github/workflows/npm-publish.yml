name: Publish to npm

on:
  push:
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org/

      - name: Allow unprivileged user namespaces (bubblewrap sandbox tests)
        # Same guard as ci.yml: newer runner images enforce
        # kernel.apparmor_restrict_unprivileged_userns=1, which breaks any
        # bwrap --unshare-net test ("loopback: Failed RTM_NEWADDR"). The
        # Linux-gated suites skip when bwrap is absent, but if the runner
        # image ever preinstalls bubblewrap the `pnpm test` release gate
        # below would fail — this is a no-op otherwise.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Publish packages
        run: pnpm publish -r --access public --no-git-checks --provenance --config.node-linker=hoisted
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
