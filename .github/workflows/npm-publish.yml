name: Publish to npm

on:
  push:
    tags: ["v*"]
  # Manual re-trigger: pnpm publish keys off the package.json version, not the
  # tag, so this re-publishes the current version from any ref without having to
  # move/recreate a release tag (which would needlessly re-run the Docker jobs).
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org/

      - name: Install system dependencies (ffmpeg, bubblewrap)
        # The release-gate `pnpm test` below runs the SAME suite as ci.yml,
        # including the Linux-gated terminal-driver tests (*.linux.test.ts) that
        # shell out to `which bwrap` and FAIL — not skip — when bubblewrap is
        # absent (resolveBwrapPath throws). ci.yml installs these deps for its
        # test jobs; this gate must match or `pnpm test` fails before publish.
        # Regressed silently because npm hadn't published since 1.0.42, before
        # the v2.x terminal-driver suites landed. ffmpeg/ffprobe likewise drive
        # the media-conversion skill tests.
        run: sudo apt-get update && sudo apt-get install -y ffmpeg bubblewrap

      - name: Allow unprivileged user namespaces (bubblewrap sandbox tests)
        # Ubuntu 24.04 runner images enforce
        # kernel.apparmor_restrict_unprivileged_userns=1, which breaks any
        # bwrap --unshare-net test ("loopback: Failed RTM_NEWADDR").
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Publish packages
        run: pnpm publish -r --access public --no-git-checks --provenance --config.node-linker=hoisted
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
