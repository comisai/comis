name: Issue Description Check

on:
  issues:
    types: [opened, edited]

# Least-privilege: only need to post/edit issue comments.
permissions:
  issues: write

jobs:
  check-issue-description:
    # Skip bot-authored issues (Renovate, dependabot, comis-agent).
    if: github.event.issue.user.type != 'Bot'
    runs-on: ubuntu-latest

    steps:
      # No checkout needed: github.event.issue.body is in the Actions context.
      # on: issues carries no PR-head code — no fork trust boundary.
      - name: Validate and comment
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const MARKER = '<!-- comis-issue-description-check -->';
            const body = context.payload.issue.body ?? '';

            // Require at least one substantive H2 section heading
            const hasHeading = /^##\s+\S/m.test(body);
            // Require meaningful content beyond the heading lines themselves
            const hasContent = body.replace(/^##.*/gm, '').trim().length >= 30;
            const isComplete = hasHeading && hasContent;

            if (isComplete) {
              // Clean up any prior "needs detail" comment if the issue is now complete
              const { data: existingComments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              });
              const prior = existingComments.find(c => c.body.includes(MARKER));
              if (prior) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: prior.id,
                });
              }
              return;
            }

            const commentBody = `${MARKER}\n### Issue description needs more detail\n\n` +
              `Please fill out the issue template sections with enough detail for ` +
              `maintainers to understand and reproduce the problem (or evaluate the feature).\n\n` +
              `Use the [bug report](/.github/ISSUE_TEMPLATE/bug_report.md) or ` +
              `[feature request](/.github/ISSUE_TEMPLATE/feature_request.md) template ` +
              `as a guide.`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(MARKER));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: commentBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody,
              });
            }
            // NOTE: No failure status is set here — issues have no merge gate.
            // The comment is the signal; a failing Actions run on an issue event is noise.
