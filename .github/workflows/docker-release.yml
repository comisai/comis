name: Docker Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
    paths:
      - "packages/**"
      - "Dockerfile"
      - "pnpm-lock.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"

      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: node .github/scripts/verify-release-tag.mjs "${GITHUB_REF_NAME}"

  # -------------------------------------------------------------------------
  # Build per-platform digests
  # Each platform runs natively on its own runner — no QEMU emulation.
  # Each runner builds both variants (default + slim) since the build stage
  # layers are shared and cached, making the second variant near-instant.
  # -------------------------------------------------------------------------
  build:
    needs: preflight
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- default variant ---
      - uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        id: build-default
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            COMIS_VARIANT=default
          cache-from: type=gha,scope=default-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=default-${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}

      # --- slim variant (reuses cached build stage from default) ---
      - uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        id: build-slim
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            COMIS_VARIANT=slim
          cache-from: |
            type=gha,scope=slim-${{ matrix.platform }}
            type=gha,scope=default-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=slim-${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}

      - name: Export digests
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests/default /tmp/digests/slim
          default_digest="${{ steps.build-default.outputs.digest }}"
          slim_digest="${{ steps.build-slim.outputs.digest }}"
          touch "/tmp/digests/default/${default_digest#sha256:}"
          touch "/tmp/digests/slim/${slim_digest#sha256:}"

      - name: Upload default digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: digests-default-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: /tmp/digests/default/*
          if-no-files-found: error
          retention-days: 1

      - name: Upload slim digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: digests-slim-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: /tmp/digests/slim/*
          if-no-files-found: error
          retention-days: 1

  # -------------------------------------------------------------------------
  # Merge per-platform images into multi-arch manifest — default
  # -------------------------------------------------------------------------
  merge-default:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: digests-default-*
          path: /tmp/digests/default
          merge-multiple: true

      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      - name: Create multi-arch manifest
        working-directory: /tmp/digests/default
        run: |
          mapfile -t tags < <(jq -r '.tags[]' <<< '${{ steps.meta.outputs.json }}')
          mapfile -t digests < <(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s\n' *)
          tag_args=()
          for tag in "${tags[@]}"; do
            tag_args+=("-t" "${tag}")
          done
          docker buildx imagetools create "${tag_args[@]}" "${digests[@]}"

  # -------------------------------------------------------------------------
  # Merge per-platform images into multi-arch manifest — slim
  # -------------------------------------------------------------------------
  merge-slim:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: digests-slim-*
          path: /tmp/digests/slim
          merge-multiple: true

      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            suffix=-slim
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      - name: Create multi-arch manifest
        working-directory: /tmp/digests/slim
        run: |
          mapfile -t tags < <(jq -r '.tags[]' <<< '${{ steps.meta.outputs.json }}')
          mapfile -t digests < <(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s\n' *)
          tag_args=()
          for tag in "${tags[@]}"; do
            tag_args+=("-t" "${tag}")
          done
          docker buildx imagetools create "${tag_args[@]}" "${digests[@]}"

  # -------------------------------------------------------------------------
  # Build web dashboard image (amd64 only — lightweight SPA)
  # -------------------------------------------------------------------------
  build-web:
    needs: preflight
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' && (
        startsWith(github.ref, 'refs/tags/v') ||
        contains(toJSON(github.event.commits.*.modified), 'packages/web/') ||
        contains(toJSON(github.event.commits.*.modified), 'docker/nginx.conf') ||
        contains(toJSON(github.event.commits.*.modified), 'Dockerfile.web')
      ) || github.event_name == 'pull_request'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6
        id: web-meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-web
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=

      - uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          file: Dockerfile.web
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.web-meta.outputs.tags }}
          labels: ${{ steps.web-meta.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
